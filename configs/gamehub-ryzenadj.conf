# GameHub RyzenAdj helper (installed to /etc/gamehub/ryzenadj.conf by
# scripts/install-host-ryzenadj.sh). Read on every request; no restart needed.

[access]
# Host uids allowed to send requests, comma-separated, single uids or ranges.
# The installer lists the host user and its subuid range (container root and
# the other container users of its rootless containers).
allowed_uids = @GAMEHUB_UID@, @GAMEHUB_SUBUID_RANGE@

[daemon]
ryzenadj = /usr/local/bin/ryzenadj

[limits]
# Allowed range for each value, as min-max, or "off" to reject the option.
# Group defaults: power (stapm/fast/slow/apu-slow limits, mW), time (stapm and
# slow PPT time constants, s), temp (tctl, APU and dGPU skin temperature, degrees C),
# current (VRM TDC/EDC limits, mA).
power = 5000-65000
time = 1-300
temp = 60-100
# Current limits are off by default: values above the board's defaults can
# overload the VRM. Enable a range only after checking `ryzenadj -i`.
current = off

# Per-option overrides take precedence over the group, e.g.:
# fast-limit = 5000-70000
# vrmmax-current = 50000-120000
